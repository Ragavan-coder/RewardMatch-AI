name: RewardMatch AI - Continuous Security & Vulnerability Scanning

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly security audit scan every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. Secret Scanning (Gitleaks)
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Secret Leakage Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # 2. Static Application Security Testing (Bandit & Semgrep)
  # ----------------------------------------------------------------------------
  sast-scan:
    name: SAST Code Analysis (Bandit & Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit Security Linter
        run: pip install bandit

      - name: Run Bandit Scan on Django Backend
        run: |
          bandit -r django_backend/ -ll -ii --format custom \
            --msg-template "{abspath}:{line}: [{test_id}] {severity}: {msg}" || true

      - name: Run Semgrep Security Rules
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/django
            p/secrets

  # ----------------------------------------------------------------------------
  # 3. Software Dependency Vulnerability Audit (pip-audit & npm audit)
  # ----------------------------------------------------------------------------
  dependency-audit:
    name: Dependency CVE Scan (pip-audit & npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm Audit
        run: |
          npm audit --audit-level=high || true

  # ----------------------------------------------------------------------------
  # 4. Automated Security Regression Tests
  # ----------------------------------------------------------------------------
  security-tests:
    name: Automated Security Regression Test Suite
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: RootMasterSecure2026!
          MYSQL_DATABASE: rewardmatch_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Security Regression Tests
        env:
          DJANGO_SECRET_KEY: test-ci-security-secret-key-64-character-string-1234567890
          DJANGO_DEBUG: False
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: rewardmatch_test
          MYSQL_USER: root
          MYSQL_PASSWORD: RootMasterSecure2026!
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
        run: |
          python django_backend/manage.py test apps.security_audit.tests apps.transactions.tests apps.accounts.tests
