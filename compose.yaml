services:
  proxy:
    image: nginx:1.27-alpine
    container_name: rewardmatch_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
      - application
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rewardmatch_frontend
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 20s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rewardmatch_backend
    restart: unless-stopped
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=backend,localhost,127.0.0.1,proxy
      - MYSQL_DATABASE=${MYSQL_DATABASE:-rewardmatch}
      - MYSQL_USER=${MYSQL_USER:-rewardmatch_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-SecureFintechPass2026!}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - application
      - database
      - jobs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  db:
    image: mysql:8.0
    container_name: rewardmatch_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-RootMasterSecure2026!}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-rewardmatch}
      - MYSQL_USER=${MYSQL_USER:-rewardmatch_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-SecureFintechPass2026!}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootMasterSecure2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M

  redis:
    image: redis:7.2-alpine
    container_name: rewardmatch_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecureToken2026!}
    volumes:
      - redis_data:/data
    networks:
      - jobs
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecureToken2026!}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rewardmatch_worker
    restart: unless-stopped
    command: celery -A rewardmatch worker -l INFO -c 2
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-rewardmatch}
      - MYSQL_USER=${MYSQL_USER:-rewardmatch_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-SecureFintechPass2026!}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-RedisSecureToken2026!}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-RedisSecureToken2026!}@redis:6379/0
    networks:
      - database
      - jobs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rewardmatch_beat
    restart: unless-stopped
    command: celery -A rewardmatch beat -l INFO
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-rewardmatch}
      - MYSQL_USER=${MYSQL_USER:-rewardmatch_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-SecureFintechPass2026!}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-RedisSecureToken2026!}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-RedisSecureToken2026!}@redis:6379/0
    networks:
      - database
      - jobs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  ai_worker:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rewardmatch_ai_worker
    restart: unless-stopped
    command: celery -A rewardmatch worker -Q ai_queue -l INFO -c 1
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-rewardmatch}
      - MYSQL_USER=${MYSQL_USER:-rewardmatch_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-SecureFintechPass2026!}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-RedisSecureToken2026!}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-RedisSecureToken2026!}@redis:6379/0
    networks:
      - database
      - jobs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3072M

networks:
  edge:
    driver: bridge
    internal: false
  application:
    driver: bridge
    internal: false
  database:
    driver: bridge
    internal: true
  jobs:
    driver: bridge
    internal: true

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
